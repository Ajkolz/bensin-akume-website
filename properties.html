<!DOCTYPE html>
<html>
<head>
<title>Our Properties | Bensin Akume Estates</title>

<style>
body{
font-family:Arial;
margin:0;
background:#0a192f;
color:#f7e7ce;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

h1{
color:gold;
text-align:center;
}

.properties{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:30px;
margin-top:40px;
}

.property{
background:#112240;
border-radius:10px;
overflow:hidden;
}

.property img{
width:100%;
height:200px;
object-fit:cover;
}

.property-info{
padding:20px;
}

button{
padding:12px 20px;
background:#800020;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>Available Properties</h1>

<div class="properties">

<div class="property">
<img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
<div class="property-info">
<h3>Luxury Beachfront Villa</h3>
<p>Lekki Phase 1</p>
<button>Request Details</button>
</div>
</div>

<div class="property">
<img src="https://images.unsplash.com/photo-1600585154207-87f1b9d8c5b3">
<div class="property-info">
<h3>Smart Luxury Apartment</h3>
<p>Victoria Island</p>
<button>Request Details</button>
</div>
</div>

<div class="property">
<img src="https://images.unsplash.com/photo-1600585154526-990dced4db0d">
<div class="property-info">
<h3>Waterfront Duplex</h3>
<p>Lekki Free Trade Zone</p>
<button>Request Details</button>
</div>
</div>

</div>

</div>

</body>
</html>
